<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my concert collection</title>

    <!-- Normalize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Google Fonts  -->
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Script -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- --------------- HEADER --------------- -->

    <header>
        <h1>my concert collection</h1>
        <p class="subtitle">17 Shows : 2018 - 2025</p>
    </header>


    <!-- --------------- CDs --------------- -->
    <main>
        <div class="cd-wall">

            <div class="cd-item" data-concert="1">
                <div class="cd-disc cd-1">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="2">
                <div class="cd-disc cd-2">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="3">
                <div class="cd-disc cd-3">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="4">
                <div class="cd-disc cd-4">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="5">
                <div class="cd-disc cd-5">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="6">
                <div class="cd-disc cd-6">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="7">
                <div class="cd-disc cd-7">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="8">
                <div class="cd-disc cd-8">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="9">
                <div class="cd-disc cd-9">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="10">
                <div class="cd-disc cd-10">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="11">
                <div class="cd-disc cd-11">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="12">
                <div class="cd-disc cd-12">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="13">
                <div class="cd-disc cd-13">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="14">
                <div class="cd-disc cd-14">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="15">
                <div class="cd-disc cd-15">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="16">
                <div class="cd-disc cd-16">
                    <div class="cd-hole"></div>
                </div>
            </div>

            <div class="cd-item" data-concert="17">
                <div class="cd-disc cd-17">
                    <div class="cd-hole"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- --------------- popup overlay --------------- -->
    <div class="overlay" id="overlay">
        <div class="overlay-backdrop" id="overlay-backdrop"></div>
        <div class="popup">
            <div class="popup-cd-container">
                <div class="popup-cd-wrap">
                    <video class="popup-video" id="popup-video" autoplay muted loop playsinline></video>
                    <div class="popup-cd-hole"></div>
                </div>
                <div class="popup-cd-ring"></div>
            </div>
            <div class="popup-info">
                <h2 id="popup-artist"></h2>
                <p id="popup-tour"></p>
                <p id="popup-venue"></p>
                <p id="popup-date"></p>
            </div>
            <a class="popup-close" id="popup-close" href="#">X</a>
        </div>
    </div>


</body>

</html>
