<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my concert collection</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>
        <h1>my concert collection</h1>
        <p class="subtitle">17 shows &bull; 2018 &ndash; 2025</p>
    </header>

    <main>
        <div class="cd-wall">

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-1">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-2">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-3">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-4">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-5">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-6">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-7">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-8">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-9">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-10">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-11">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-12">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-13">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-14">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-15">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-16">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

            <div class="cd-item">
                <a href="#overlay">
                    <div class="cd-disc cd-17">
                        <div class="cd-hole"></div>
                    </div>
                </a>
            </div>

        </div>
    </main>

    <!-- overlay: hidden by default, shown when targeted -->
    <div class="overlay" id="overlay">
        <a class="overlay-backdrop" href="#"></a>
        <div class="popup">
            <div class="popup-cd-wrap">
                <div class="popup-cd-disc cd-1">
                    <div class="popup-cd-hole"></div>
                </div>
                <div class="popup-cd-ring"></div>
            </div>
            <div class="popup-info">
                <h2>Stray Kids</h2>
                <p>Maniac World Tour</p>
                <p>Oakland Arena</p>
                <p>July 12, 2022</p>
            </div>
            <a class="popup-close" href="#">X</a>
        </div>
    </div>

</body>

</html>
